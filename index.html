<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sử Thế Studio</title>
<style>
  :root { --ink:#2a2118; --muted:#6b5e4d; --paper:#f7efdd; --card:#fffdf7; --line:#e4d7bd; --accent:#c0392b; --gold:#d79a2b; }
  *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6}
  .wrap{max-width:640px;margin:0 auto;padding:56px 18px;text-align:center}
  .logo{width:92px;height:92px;border-radius:50%;background:var(--gold);display:inline-flex;align-items:center;
    justify-content:center;font-weight:800;font-size:1.5rem;color:#3a2d12;border:4px solid #3a2d12}
  h1{font-size:2rem;margin:18px 0 4px} .tag{color:var(--muted);font-size:1.05rem}
  .links{margin:30px 0 10px;display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a.btn{display:inline-block;padding:11px 20px;border-radius:999px;background:var(--accent);color:#fff;
    text-decoration:none;font-weight:600}
  a.btn.alt{background:#1877f2} a.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
  p{color:var(--muted)} .foot{margin-top:40px;font-size:.85rem;color:var(--muted)}
  a{color:var(--accent)}
  @media (prefers-color-scheme:dark){:root{--ink:#ece3d2;--muted:#a99e8a;--paper:#201b14;--card:#2a241b;--line:#4a4030;--accent:#e8766b}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">Sử<br>Thế</div>
  <h1>Sử Thế Studio</h1>
  <div class="tag">Tóm tắt Lịch sử Việt Nam &amp; Thế giới — kể lại dễ hiểu, chính xác.</div>
  <p>Kênh nội dung lịch sử bằng hoạt hình, cùng công cụ tự động hoá sản xuất &amp; đăng tải của riêng chủ kênh.</p>
  <div class="links">
    <a class="btn" href="https://www.youtube.com/@kenhsuthe" target="_blank" rel="noopener">▶ YouTube Sử Thế</a>
    <a class="btn ghost" href="./privacy.html">Chính sách bảo mật</a>
  </div>
  <div class="foot">© 2026 Sử Thế Studio · Liên hệ: binhnv199102@gmail.com</div>
</div>
</body>
</html>
